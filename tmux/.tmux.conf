# set -ga terminal-overrides ",screen-255color*:Tc"
# set-option -g default-terminal "screen-256color"
set -s escape-time 0
set -g default-terminal "tmux-256color"
set -ag terminal-overrides ",xterm-256color:RGB"
# r = rename current window, R = reload config
unbind r
bind r command-prompt -I "#W" "rename-window '%%'"
bind R source-file ~/.tmux.conf \; display "tmux config reloaded"

set-option -g status-position top

unbind C-b
set-option -g prefix C-a
bind-key C-a send-prefix
set -g status-style 'bg=#333333 fg=#5eacd3'

# Nested tmux: F6 toggles the OUTER tmux off so keys pass through to an
# inner (e.g. SSH server) tmux. F6 again re-enables this tmux.
bind -T root F6 \
  set prefix None \;\
  set key-table off \;\
  set status-style 'bg=#222222 fg=#888888' \;\
  refresh-client -S
bind -T off F6 \
  set -u prefix \;\
  set -u key-table \;\
  set -u status-style \;\
  refresh-client -S

set -g base-index 1

set-window-option -g mode-keys vi
bind -T copy-mode-vi v send-keys -X begin-selection
bind -T copy-mode-vi y send-keys -X copy-pipe-and-cancel 'xclip -in -selection clipboard'

# vim-like pane switching
bind -r ^ last-window
bind -r k select-pane -U
bind -r j select-pane -D
bind -r h select-pane -L
bind -r l select-pane -R

# forget the find window.  That is for chumps
bind-key -r f run-shell "tmux neww ~/tmux-sessionizer"

bind-key -r h run-shell "~/tmux-sessionizer ~/Development/onevite-api"
bind-key -r g run-shell "~/tmux-sessionizer ~/Development/onevite-frontend"
bind-key -r T run-shell "~/tmux-sessionizer ~/dotfiles"
bind-key -r N run-shell "~/tmux-sessionizer ~/notes"

set -g @catppuccin_window_status_style "rounded"

# List of plugins
set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'christoomey/vim-tmux-navigator'
set -g @plugin 'catppuccin/tmux#v2.1.0'

set -g status-left ""
set -g status-right "#{E:@catppuccin_status_application} #{E:@catppuccin_status_session}"

# Initialize TMUX plugin manager (keep this line at the very bottom of tmux.conf)
run '~/.tmux/plugins/tpm/tpm'

set -g status-style bg=default
